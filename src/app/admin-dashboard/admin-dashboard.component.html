<div id="main">
    <main>
        <app-back-button></app-back-button>
        <div style="display: flex; justify-content: space-between; flex-direction: row;">
            <h1>Utenti Registrati</h1>
            <div style="display: flex; align-items: center;">
                <button (click)="route('aule')" style="margin-right: 5px; background: #3a6ea5">Gestisci Aule</button>
                <button (click)="route('materie')" style="margin-right: 5px; background: #3a6ea5">Gestisci Materie</button>
                <button (click)="route('crea-utente')" style="background: #3a6ea5">Crea Utente</button>
            </div>
        </div>
        <div id="container" *ngIf="caricamentoCompletato">
            <div>
                <div class="group">
                    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><g><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"></path></g></svg>
                    <input placeholder="Cerca per Nome, Descrizione o Materia..." type="text" class="input" (keyup)="cerca(finder.value)" #finder>
                </div>
            </div>
            <div *ngFor="let utente of datiPersone | async" >
                <app-user-view [utente]="utente.persona" [sportelliPrenotati]="utente.sportelli"></app-user-view>
                <hr>
            </div>
            <div *ngIf="!datiPersone">Nessun Utente Disponibile.</div>
        </div>
            <div class="pagination" *ngIf="datiPersone">
                <button class="prev" (click)="navigateToPage(currentPage - 1)">Precedente</button>
                <span class="page-number">{{ currentPage + 1 }}</span>
                <button class="next" (click)="navigateToPage(currentPage + 1)">Prossima</button>
            </div>
    </main>
</div>

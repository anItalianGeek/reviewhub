<div id="main" *ngIf="caricamentoCompletato">
    <main>
        <div *ngIf="utente | async as utente" id="mainDiv">
            <div style="display: flex; flex-direction: row; justify-content: space-between">
                <p id="msgBenvenuto">Ciao {{utente.nome}}!</p>
                <div id="buttons">
                    <button *ngIf="utente.ruolo === 'ADMIN'" (click)="this.router.navigateByUrl('/admin-dashboard')">Gestisci Servizio</button>
                    <button *ngIf="utente.ruolo !== 'STUDENT'" (click)="this.router.navigateByUrl('/create-sportello')">Crea Sportello</button>
                    <button (click)="logout()">Log out</button>
                </div>
            </div>
            <div *ngIf="utente.ruolo == 'STUDENT'" id="pulsantiSportelli">
                <span>Visualizza Sportelli: </span>
                <label for="disponibiliCB">Disponibili</label>
                <input type="radio" name="selezionaSportelli" id="disponibiliCB" (click)="cercaSportelli(true)" #disponibiliCB>
                <label for="prenotatiCB">Ai Quali Sei Iscritto</label>
                <input type="radio" name="selezionaSportelli" id="prenotatiCB" (click)="cercaSportelli(false)" #prenotatiCB>
            </div>
            <div>
                <div class="group">
                    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><g><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"></path></g></svg>
                    <input placeholder="Cerca per Nome, Descrizione o Materia..." type="text" class="input" (keyup)="cerca(finder.value)" #finder>
                </div>
            </div>
            <div *ngIf="sportelli">
                <app-sportello-compact-view *ngFor="let sportello of sportelli | async" [sportello]="sportello" (click)="route(sportello.id_sportello)" class="sportello"></app-sportello-compact-view>
                <div *ngIf="sportelliTrovati">Nessuno Sportello Disponibile.</div>
            </div>
            <div *ngIf="!sportelli">
                Nessuno Sportello Disponibile.
            </div>
        </div>
    </main>
</div>
<app-loader *ngIf="!caricamentoCompletato" style="height: 100vh; display: flex; justify-content: center; align-items: center;"></app-loader>
